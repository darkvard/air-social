basePath: /air-social/api/v1
definitions:
  air-social_internal_domain_common.OffsetPaginatedResult-internal_transport_http_follow_UserFollowResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_transport_http_follow.UserFollowResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        format: int64
        type: integer
      totalPages:
        type: integer
    type: object
  air-social_internal_domain_media.UploadDomain:
    enum:
    - users
    - posts
    - messages
    type: string
    x-enum-varnames:
    - DomainUser
    - DomainPost
    - DomainMessage
  air-social_internal_domain_media.UploadFeature:
    enum:
    - avatar
    - cover
    - feed_image
    - feed_video
    - voice_chat
    - attachment
    type: string
    x-enum-varnames:
    - FeatureAvatar
    - FeatureCover
    - FeatureFeedImage
    - FeatureFeedVideo
    - FeatureVoiceChat
    - FeatureAttachment
  internal_transport_http_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_transport_http_auth.LoginRequest:
    properties:
      device_id:
        type: string
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - device_id
    - email
    - password
    type: object
  internal_transport_http_auth.LoginResponse:
    properties:
      token:
        $ref: '#/definitions/internal_transport_http_auth.TokenResponse'
      user:
        $ref: '#/definitions/internal_transport_http_auth.UserResponse'
    type: object
  internal_transport_http_auth.LogoutRequest:
    properties:
      is_all_devices:
        type: boolean
    type: object
  internal_transport_http_auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_transport_http_auth.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  internal_transport_http_auth.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
      verified:
        type: boolean
    type: object
  internal_transport_http_auth.ResetPasswordRequest:
    properties:
      password:
        maxLength: 64
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  internal_transport_http_auth.TokenResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
      type:
        type: string
    type: object
  internal_transport_http_auth.UserResponse:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
      verified:
        type: boolean
    type: object
  internal_transport_http_comment.CreateRequest:
    properties:
      content:
        maxLength: 1000
        type: string
      media:
        items:
          $ref: '#/definitions/internal_transport_http_comment.MediaItemInput'
        maxItems: 4
        type: array
      parent_id:
        type: integer
    required:
    - content
    type: object
  internal_transport_http_comment.CreateResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      media:
        items:
          $ref: '#/definitions/internal_transport_http_comment.MediaItemResponse'
        type: array
      parent_id:
        type: integer
    type: object
  internal_transport_http_comment.MediaItemInput:
    properties:
      media_key:
        type: string
      media_type:
        enum:
        - image
        - video
        - audio
        - document
        type: string
    required:
    - media_key
    - media_type
    type: object
  internal_transport_http_comment.MediaItemResponse:
    properties:
      media_type:
        type: string
      url:
        type: string
    type: object
  internal_transport_http_follow.UserFollowResponse:
    properties:
      avatar:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_follower:
        type: boolean
      is_following:
        type: boolean
      is_verified:
        type: boolean
    type: object
  internal_transport_http_media.BulkPresignRequest:
    properties:
      files:
        items:
          $ref: '#/definitions/internal_transport_http_media.PresignRequest'
        maxItems: 10
        minItems: 1
        type: array
    required:
    - files
    type: object
  internal_transport_http_media.PresignRequest:
    properties:
      domain:
        allOf:
        - $ref: '#/definitions/air-social_internal_domain_media.UploadDomain'
        enum:
        - users
        - posts
        - groups
        - messages
      feature:
        allOf:
        - $ref: '#/definitions/air-social_internal_domain_media.UploadFeature'
        enum:
        - avatar
        - cover
        - feed_image
        - feed_video
        - voice_chat
        - attachment
      file_name:
        type: string
      file_size:
        type: integer
      file_type:
        type: string
    required:
    - domain
    - feature
    - file_name
    - file_size
    - file_type
    type: object
  internal_transport_http_media.PresignResponse:
    properties:
      expire_at:
        type: string
      file_name:
        type: string
      form_data:
        additionalProperties:
          type: string
        type: object
      object_key:
        type: string
      public_url:
        type: string
      upload_url:
        type: string
    type: object
  internal_transport_http_post.CreateRequest:
    properties:
      content:
        type: string
      media:
        items:
          $ref: '#/definitions/internal_transport_http_post.MediaItemInput'
        maxItems: 10
        type: array
      visibility:
        enum:
        - public
        - followers
        - private
        type: string
    type: object
  internal_transport_http_post.CreateResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      media:
        items:
          $ref: '#/definitions/internal_transport_http_post.MediaItemResponse'
        type: array
      visibility:
        type: string
    type: object
  internal_transport_http_post.CursorPaginatedResponse-internal_transport_http_post_PostResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_transport_http_post.PostResponse'
        type: array
      meta:
        $ref: '#/definitions/internal_transport_http_post.MetaCursor'
    type: object
  internal_transport_http_post.MediaItemInput:
    properties:
      duration:
        minimum: 0
        type: integer
      file_name:
        maxLength: 255
        type: string
      height:
        minimum: 0
        type: integer
      media_key:
        type: string
      media_type:
        enum:
        - image
        - video
        - audio
        - document
        type: string
      size:
        type: integer
      width:
        minimum: 0
        type: integer
    required:
    - file_name
    - media_key
    - media_type
    - size
    type: object
  internal_transport_http_post.MediaItemResponse:
    properties:
      duration:
        type: integer
      file_name:
        type: string
      height:
        type: integer
      id:
        type: integer
      media_type:
        type: string
      url:
        type: string
      width:
        type: integer
    type: object
  internal_transport_http_post.MetaCursor:
    properties:
      has_next_page:
        type: boolean
      next_cursor:
        type: integer
    type: object
  internal_transport_http_post.PostResponse:
    properties:
      author:
        $ref: '#/definitions/internal_transport_http_post.UserResponse'
      comments_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_liked:
        type: boolean
      likes_count:
        type: integer
      media:
        items:
          $ref: '#/definitions/internal_transport_http_post.MediaItemResponse'
        type: array
      shares_count:
        type: integer
      updated_at:
        type: string
      visibility:
        type: string
    type: object
  internal_transport_http_post.UpdateRequest:
    properties:
      content:
        type: string
      media:
        items:
          $ref: '#/definitions/internal_transport_http_post.MediaItemInput'
        maxItems: 10
        type: array
      visibility:
        enum:
        - public
        - followers
        - private
        type: string
    type: object
  internal_transport_http_post.UserResponse:
    properties:
      avatar:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_verified:
        type: boolean
    type: object
  internal_transport_http_user.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_transport_http_user.ProfileResponse:
    properties:
      avatar:
        type: string
      bio:
        type: string
      cover_image:
        type: string
      full_name:
        type: string
      location:
        type: string
      website:
        type: string
    type: object
  internal_transport_http_user.StatusResponse:
    properties:
      verified:
        type: boolean
      verified_at:
        type: string
    type: object
  internal_transport_http_user.UpdateImageRequest:
    properties:
      object_key:
        type: string
    required:
    - object_key
    type: object
  internal_transport_http_user.UpdateProfileRequest:
    properties:
      bio:
        maxLength: 255
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      location:
        maxLength: 100
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
      website:
        maxLength: 255
        type: string
    type: object
  internal_transport_http_user.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      profile:
        $ref: '#/definitions/internal_transport_http_user.ProfileResponse'
      status:
        $ref: '#/definitions/internal_transport_http_user.StatusResponse'
      updated_at:
        type: string
      username:
        type: string
      version:
        type: integer
    type: object
  pkg.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  pkg.Response:
    properties:
      code:
        type: integer
      data: {}
      errors: {}
      message:
        type: string
    type: object
  pkg.ValidationResult:
    properties:
      errors:
        items:
          $ref: '#/definitions/pkg.FieldError'
        type: array
    type: object
host: localhost
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Backend service for Air Social application.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Air Social API
  version: "1.0"
paths:
  /:
    get:
      description: Render the API welcome page with status overview.
      produces:
      - text/html
      responses:
        "200":
          description: HTML Page
          schema:
            type: string
        "503":
          description: HTML Page (Maintenance)
          schema:
            type: string
      summary: Welcome page
      tags:
      - Health
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiate password reset process. Sends an email containing a random
        token to reset the password.
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Instruction message
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ValidationResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: Request password reset
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user credentials. Returns a JWT Access Token and a
        Refresh Token.
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ValidationResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke current device session or all sessions
      parameters:
      - description: Logout Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Use a valid Refresh Token to obtain a new pair of JWT Access/Refresh
        tokens.
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ValidationResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account. Sends a verification email with a random
        token to the registered email address.
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_transport_http_auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ValidationResult'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: Register a new user account
      tags:
      - Auth
  /auth/reset-password:
    get:
      description: Render the HTML page for resetting password using the random token
        from email.
      parameters:
      - description: Random Reset Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML Page
          schema:
            type: string
        "400":
          description: HTML Page
          schema:
            type: string
      summary: Show reset password page
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Update the user's password using the valid random token received
        via email.
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: password update successfully
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ValidationResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: Reset password
      tags:
      - Auth
  /auth/verify-email:
    get:
      description: Verify user email address using the random token sent during registration.
      parameters:
      - description: Random Verification Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML Page
          schema:
            type: string
        "400":
          description: HTML Page
          schema:
            type: string
      summary: Verify email address
      tags:
      - Auth
  /comments/{id}/likes:
    delete:
      consumes:
      - application/json
      description: Unlike a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Unlike a comment
      tags:
      - Like
    post:
      consumes:
      - application/json
      description: Like a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Like a comment
      tags:
      - Like
  /health:
    get:
      description: Check the health status of the application components
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BasicAuth: []
      summary: Health check
      tags:
      - Health
  /media/presigned-urls:
    post:
      consumes:
      - application/json
      description: |-
        Generates a list of presigned URLs and policy signatures for direct file upload to MinIO/S3.

        **Client Integration:**
        * **Target:** Send a `POST` request to the returned `upload_url`.
        * **Payload:** Use `multipart/form-data`. Append all fields from `form_data` (must be FIRST) followed by the file binary (must be LAST).
        * **Success:** Upon successful upload (HTTP 204), confirm the `object_key` with the Backend database.
      parameters:
      - description: File Metadata List
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_media.BulkPresignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Upload Credentials List
          schema:
            items:
              $ref: '#/definitions/internal_transport_http_media.PresignResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ValidationResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Get presigned upload URL
      tags:
      - Media
  /posts:
    post:
      consumes:
      - application/json
      description: Create a new post with content and optional media attachments.
      parameters:
      - description: Create Post Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_post.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_transport_http_post.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Create a new post
      tags:
      - Post
  /posts/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a post by ID. Only the owner can delete their post.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - Post
    get:
      consumes:
      - application/json
      description: Get post details by ID
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_post.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Get post detail
      tags:
      - Post
    patch:
      consumes:
      - application/json
      description: Update post content or visibility. Only the owner can update their
        post.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Post Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_post.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_post.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - Post
  /posts/{id}/comments:
    post:
      consumes:
      - application/json
      description: Create a new comment on a post or reply to an existing comment.
